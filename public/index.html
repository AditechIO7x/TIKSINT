<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analisis Profil TikTok</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #09090b;
        }
        .premium-border {
            border-color: rgba(63, 63, 70, 0.4);
        }
        .gradient-bg {
            background: radial-gradient(circle at top center, #1e1b4b 0%, #09090b 100%);
        }
    </style>
</head>
<body class="text-zinc-200 min-h-screen gradient-bg antialiased selection:bg-indigo-500 selection:text-white">

    <div class="max-w-6xl mx-auto px-4 py-16">
        <div class="text-center mb-12">
            <h1 class="text-3xl md:text-4xl font-extrabold tracking-tight text-white">
                Analitik Data Akun TikTok
            </h1>
            <p class="text-sm text-zinc-400 mt-2 max-w-md mx-auto leading-relaxed">
                Platform peninjauan metrik dan informasi publik terstruktur untuk kebutuhan riset serta verifikasi profil.
            </p>
        </div>

        <div class="max-w-xl mx-auto bg-zinc-900/60 border premium-border rounded-2xl p-5 backdrop-blur-md shadow-xl mb-12">
            <div class="flex flex-col sm:flex-row gap-2.5">
                <div class="relative flex-1">
                    <span class="absolute left-4 top-3.5 text-zinc-500 text-sm font-medium">@</span>
                    <input type="text" id="usernameInput" placeholder="nama_pengguna" 
                        class="w-full bg-zinc-950 border border-zinc-800 rounded-xl pl-9 pr-4 py-3 text-sm text-white placeholder-zinc-600 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all font-medium">
                </div>
                <button id="btnAnalyze" onclick="runAnalysis()" 
                    class="bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold px-6 py-3 rounded-xl transition-all duration-200 active:scale-98 shadow-lg shadow-indigo-600/10">
                    Cari Profil
                </button>
            </div>
            <div id="statusMessage" class="mt-3 text-xs text-zinc-500 hidden flex items-center gap-2 font-medium">
                <svg class="animate-spin h-3.5 w-3.5 text-indigo-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                Sedang memproses data profil, mohon tunggu...
            </div>
        </div>

        <div id="errorBox" class="bg-red-950/20 border border-red-900/50 text-red-400 p-4 rounded-xl max-w-xl mx-auto mb-12 hidden text-xs font-medium leading-relaxed"></div>

        <div id="resultDashboard" class="hidden grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
            <div class="lg:col-span-4 bg-zinc-900/40 border premium-border rounded-2xl p-6 flex flex-col items-center text-center backdrop-blur-md shadow-sm">
                <div class="relative mb-4">
                    <img id="avatarImg" src="" alt="Foto Profil" class="w-28 h-28 rounded-full border border-zinc-800 p-1 object-cover bg-zinc-950">
                </div>
                <h2 id="profileName" class="text-base font-bold text-white tracking-tight break-all"></h2>
                <p id="profileHandle" class="text-xs text-indigo-400 font-medium mt-0.5 mb-5"></p>
                
                <div class="w-full space-y-4 text-left border-t border-zinc-800/60 pt-4">
                    <div>
                        <span class="text-[11px] font-semibold text-zinc-500 uppercase tracking-wider block mb-1">Deskripsi Bio</span>
                        <div id="profileBio" class="text-xs text-zinc-300 bg-zinc-950/50 p-3 rounded-xl border border-zinc-900/60 min-h-[60px] break-words leading-relaxed font-medium"></div>
                    </div>
                    <div>
                        <span class="text-[11px] font-semibold text-zinc-500 uppercase tracking-wider block mb-1">Tautan Web</span>
                        <div class="bg-zinc-950/50 p-3 rounded-xl border border-zinc-900/60 overflow-hidden">
                            <a id="bioLink" href="#" target="_blank" class="text-xs text-indigo-400 hover:text-indigo-300 transition-colors block truncate font-medium"></a>
                        </div>
                    </div>
                </div>
            </div>

            <div class="lg:col-span-8 bg-zinc-900/40 border premium-border rounded-2xl overflow-hidden backdrop-blur-md shadow-sm">
                <div class="bg-zinc-900/80 px-6 py-4 border-b border-zinc-800/60 flex justify-between items-center">
                    <span class="text-xs font-bold text-zinc-300 uppercase tracking-wider">Rincian Informasi Akun</span>
                    <span class="text-[10px] bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-2 py-0.5 rounded-md font-semibold">Data Valid</span>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-xs text-left">
                        <tbody id="metricsTableBody" class="divide-y divide-zinc-800/40">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function runAnalysis() {
            const input = document.getElementById('usernameInput').value.trim();
            const btn = document.getElementById('btnAnalyze');
            const status = document.getElementById('statusMessage');
            const errorBox = document.getElementById('errorBox');
            const dashboard = document.getElementById('resultDashboard');
            const tableBody = document.getElementById('metricsTableBody');

            if (!input) return;

            btn.disabled = true;
            status.classList.remove('hidden');
            errorBox.classList.add('hidden');
            dashboard.classList.add('hidden');
            tableBody.innerHTML = '';

            try {
                const response = await fetch(`/api/scrape?username=${encodeURIComponent(input)}`);
                const result = await response.json();

                if (!result.success) {
                    throw new Error(result.error || 'Gagal memuat data profil. Silakan periksa kembali penulisan nama pengguna.');
                }

                const data = result.metrics;

                document.getElementById('avatarImg').src = data.avatar_hd_url !== 'N/A' ? data.avatar_hd_url : 'https://placehold.co/150';
                document.getElementById('profileName').innerText = data.nickname;
                document.getElementById('profileHandle').innerText = `@${data.username}`;
                document.getElementById('profileBio').innerText = data.bio_signature || 'Tidak ada deskripsi bio.';
                
                const bioLinkEl = document.getElementById('bioLink');
                if (data.bio_link_url !== 'N/A') {
                    bioLinkEl.innerText = data.bio_link_url;
                    bioLinkEl.href = data.bio_link_url;
                } else {
                    bioLinkEl.innerText = 'Tidak ada tautan eksternal';
                    bioLinkEl.removeAttribute('href');
                }

                const labelMap = {
                    "username": "Nama Pengguna (Username)",
                    "nickname": "Nama Tampilan (Nickname)",
                    "user_id": "ID Pengguna Alternatif (UID)",
                    "sec_uid": "ID Keamanan Internal (SecUID)",
                    "region": "Wilayah Pendaftaran Akun",
                    "account_created_at": "Tanggal Pembuatan Akun",
                    "account_created_timestamp": "Timestamp Registrasi",
                    "last_nickname_modified_at": "Pembaruan Nama Tampilan Terakhir",
                    "last_username_modified_at": "Pembaruan Nama Pengguna Terakhir",
                    "is_verified": "Status Lencana Terverifikasi",
                    "is_private": "Status Privasi Akun",
                    "followers_count": "Jumlah Pengikut",
                    "following_count": "Jumlah Mengikuti",
                    "total_hearts_received": "Total Suka yang Diterima",
                    "videos_count": "Jumlah Video Publik",
                    "total_liked_by_user": "Jumlah Video yang Disukai",
                    "bio_signature": "Teks Deskripsi Bio",
                    "bio_link_url": "Alamat Tautan Bio",
                    "avatar_hd_url": "Tautan Foto Profil Kualitas Tinggi",
                    "is_favorites_tab_public": "Tab Favorit Terbuka Umum"
                };

                for (const [key, value] of Object.entries(data)) {
                    let displayValue = value;
                    let textClass = "text-zinc-300";
                    
                    if (typeof value === 'boolean') {
                        displayValue = value ? 'Ya / Aktif' : 'Tidak / Nonaktif';
                        textClass = value ? "text-emerald-400 font-semibold" : "text-zinc-500";
                    } else if (typeof value === 'number') {
                        displayValue = value.toLocaleString('id-ID');
                        textClass = "text-white font-medium";
                    } else if (value === 'N/A' || value === '') {
                        displayValue = 'Tidak Terdata';
                        textClass = "text-zinc-600 italic";
                    }

                    const row = `
                        <tr class="hover:bg-zinc-800/20 transition-all duration-150">
                            <td class="px-6 py-4 font-semibold text-zinc-400 text-[11px] uppercase tracking-wider w-1/2">${labelMap[key] || key}</td>
                            <td class="px-6 py-4 text-xs font-medium ${textClass} break-all">${displayValue}</td>
                        </tr>
                    `;
                    tableBody.innerHTML += row;
                }

                dashboard.classList.remove('hidden');

            } catch (err) {
                errorBox.innerText = err.message;
                errorBox.classList.remove('hidden');
            } finaly {
                btn.disabled = false;
                status.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
